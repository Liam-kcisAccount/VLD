<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin · VLD Portfolio</title>
  <!-- This page is the ONLY editable entry point to the site.
       It requires a Netlify Identity login (invite-only) to do anything.
       Anyone without an invite who opens this URL sees a login screen
       and nothing else — they cannot read or change content from here. -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    // Explicitly force the widget to open whenever an invite / recovery /
    // confirmation token is present in the URL. Relying purely on the
    // widget's automatic hash-detection can silently authenticate the
    // token without ever showing the "set your password" screen — this
    // makes sure the modal actually appears.
    if (window.netlifyIdentity) {
      var hasAuthToken = /invite_token|recovery_token|confirmation_token|email_change_token/.test(window.location.hash);
      window.netlifyIdentity.on("init", (user) => {
        if (hasAuthToken) {
          window.netlifyIdentity.open();
        }
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // Redirect Identity's confirmation/invite links back to this admin page.
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", (user) => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
