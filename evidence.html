<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evidence · VLD Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script>
  if (window.location.hash && /invite_token|recovery_token|confirmation_token|email_change_token/.test(window.location.hash)) {
    window.location.replace("/admin/" + window.location.hash);
  }
</script>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="wordmark" href="index.html">vld<span>/</span>portfolio</a>
    <nav class="mainnav">
      <a href="index.html">Home</a>
      <a href="course-log.html">Course Log</a>
      <a href="journal.html">Journal</a>
      <a href="bio.html">Learner Bio</a>
      <a href="evidence.html" class="active">Evidence</a>
    </nav>
  </div>
</header>

<main>
  <h1>Evidence</h1>
  <p class="intro-note">Certificates, screenshots, project links, and anything else that proves progress rather than just claiming it.</p>

  <div class="evidence-grid" id="evidence-list"><div class="empty-state">Loading…</div></div>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <span>Kang Chiao International School · Virtual Learning &amp; Development · 2026–2027</span>
    <a href="index.html">← Back to home</a>
  </div>
</footer>

<script src="js/site.js"></script>
<script>
(async function () {
  const data = await loadJSON("content/evidence.json");
  const host = document.getElementById("evidence-list");
  if (!data || !(data.items || []).length) {
    host.innerHTML = emptyState("No evidence uploaded yet.");
    return;
  }
  const items = data.items.slice().sort((a, b) => (a.date < b.date ? 1 : -1));
  host.innerHTML = items.map((e) => `
    <div class="evidence-card">
      <div class="entry-gutter">
        ${formatDate(e.date)}
        <span class="kind">${escapeHTML(e.type || "note")}</span>
      </div>
      <div class="entry-body">
        <h3>${escapeHTML(e.title)}</h3>
        ${paragraphs(e.description)}
        ${e.link ? `<a class="btn" href="${escapeHTML(e.link)}">View →</a>` : ""}
      </div>
    </div>
  `).join("");
})();
</script>
</body>
</html>
